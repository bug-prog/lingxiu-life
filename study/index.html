<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#92400e">
  <meta name="description" content="屬靈學習書架：選擇一本書，再用淺白導讀、原文卡和聆聽慢慢讀。">
  <title>屬靈書</title>
  <script>
  // 舊連結相容：index.html#chapter-N（福音神學陪伴閱讀）轉往 gospel.html
  const legacy = () => { if (/^#chapter-\d+$/.test(location.hash)) location.replace('gospel.html' + location.hash); };
  legacy(); addEventListener('hashchange', legacy);
  </script>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="site-theme.css">
  <link rel="stylesheet" href="book.css">
  <script src="embed.js"></script>
  <style>
  .shelf{max-width:1100px;margin:0 auto;padding:22px 32px 30px}
  .shelf h1{font-size:28px;margin:0 0 4px}.shelf>p{color:var(--muted);margin:0 0 18px}
  .shelf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .shelf-book{display:flex;flex-direction:column;gap:10px;border:1px solid var(--border);background:var(--card);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow)}
  .shelf-book .cat{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.06em}
  .shelf-book h2{margin:0;font-size:22px;line-height:1.35}.shelf-book .by{margin:0;color:var(--muted);font-size:14px}
  .shelf-book p.d{margin:0;font-size:15px;line-height:1.7}
  .shelf-book .tags{display:flex;flex-wrap:wrap;gap:6px}
  .shelf-book .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:6px}
  .shelf-book .acts .button{min-height:44px}
  .shelf-last{font-size:13px;color:var(--muted);min-height:0;margin:0}
  .shelf-resume{height:auto!important;padding-top:8px;padding-bottom:8px;display:flex;flex-direction:column;align-items:flex-start;min-height:48px;line-height:1.35}.shelf-resume[hidden]{display:none}.shelf-resume small{display:block;font-weight:400;font-size:12px;opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  @media(max-width:600px){.shelf{padding:14px 14px 20px}.shelf h1{font-size:23px}.shelf-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html" aria-label="慢慢讀書架"><span class="brand-icon" aria-hidden="true">慢</span><span><strong>慢慢讀<span class="brand-dot">.</span></strong><small>一本書，一小步</small></span></a>
</header>
<main class="shelf" id="main">
  <h1>屬靈書</h1>
  <p>每本書都有淺白導讀、原文卡、聆聽和全書目錄。</p>
  <div class="shelf-grid">
    <article class="shelf-book" data-book="lingxiu">
      <span class="cat">靈修操練 · 入門推薦</span>
      <h2>靈修生活</h2><p class="by">吳主光 著</p>
      <p class="d">怎樣專心靈修、禱告、讀經、明白神的旨意。按「入門 → 紮根 → 進深 → 專題」由淺入深編排。</p>
      <div class="tags"><span class="badge ok">7 章 + 4 附篇</span><span class="badge">12 課導讀</span><span class="badge">由淺入深</span></div>
      <p class="shelf-last" data-last="slow-reader:lingxiu:v1"></p>
      <a class="button primary shelf-resume" data-resume="slow-reader:lingxiu:marks:v1" href="lingxiu.html#resume" hidden><span>↺ 繼續上次閱讀</span><small></small></a>
      <div class="acts"><a class="button primary" href="lingxiu.html">開始導讀 →</a><a class="button outline" href="lingxiu-book.html">目錄與原文</a></div>
    </article>
    <article class="shelf-book" data-book="gospel">
      <span class="cat">神學 · 進深</span>
      <h2>福音神學暨福音難題解答</h2><p class="by">吳主光 著 · 種籽出版社</p>
      <p class="d">神論、基督救贖論、人論三部共 44 章，第一部附淺白導讀，另有問題解答。</p>
      <div class="tags"><span class="badge ok">3 部 44 章</span><span class="badge">14 章導讀</span><span class="badge">原書頁碼</span></div>
      <p class="shelf-last" data-last="slow-reader:v1"></p>
      <a class="button primary shelf-resume" data-resume="slow-reader:marks:v1" href="gospel.html#resume" hidden><span>↺ 繼續上次閱讀</span><small></small></a>
      <div class="acts"><a class="button primary" href="gospel.html">陪伴閱讀 →</a><a class="button outline" href="book.html">目錄與原文</a></div>
    </article>
  </div>
</main>
<script>
document.querySelectorAll('[data-last]').forEach(el => {
  try { const s = JSON.parse(localStorage.getItem(el.dataset.last) || 'null'); if (s && s.chapter) el.textContent = `上次讀到第 ${s.chapter} 課／章，已讀完 ${(s.done || []).length} 個。`; } catch {}
});
document.querySelectorAll('[data-resume]').forEach(a => {
  try { const m = (JSON.parse(localStorage.getItem(a.dataset.resume) || 'null') || {}).last; if (m && m.chapter) { a.hidden = false; a.querySelector('small').textContent = `${m.mode === 'easy' ? '導讀' : '原文'}第 ${m.card + 1} 小段${m.para > 0 ? '第 ' + (m.para + 1) + ' 段' : ''}${m.sent > 0 ? '第 ' + (m.sent + 1) + ' 句' : ''}${m.snippet ? '「' + m.snippet.slice(0, 24) + '…」' : ''}`; } } catch {}
});
try { const t = (JSON.parse(localStorage.getItem('slow-reader:v1') || '{}').settings || {}).theme; if (t) document.body.dataset.theme = t; } catch {}
</script>
</body>
</html>
